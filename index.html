<!DOCTYPE html>
<html lang="en">
<head><script>window.DEFAULT_SET='tadn-po';</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CareChart Academic EHR — Student Playground</title>
<style>
:root{
  --ink:#1d2733; --muted:#5d6b7a; --line:#d5dde5; --bg:#eef2f5; --panel:#fff;
  --top:#16323f; --top2:#22495a; --accent:#0f7c86; --accent-soft:#e2f3f4;
  --red:#b42318; --red-soft:#fde8e6; --amber:#9a5b00; --amber-soft:#fff3d6;
  --green:#18794e; --green-soft:#e3f5ea; --blue:#1b5fa8; --blue-soft:#e6effa;
}
*{box-sizing:border-box}
body{margin:0;font:13px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--ink);background:var(--bg)}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:#fff;border-radius:4px;padding:4px 10px;color:var(--ink)}
button:hover{background:#f4f7f9}
button.pri{background:var(--accent);border-color:var(--accent);color:#fff}
button.pri:hover{background:#0b6870}
button.danger{background:var(--red);border-color:var(--red);color:#fff}
button.warnb{background:var(--amber-soft);border-color:#e6c27a}
button:disabled{opacity:.45;cursor:not-allowed}
input,select,textarea{font:inherit;border:1px solid #b9c5d0;border-radius:3px;padding:4px 6px;background:#fff;color:var(--ink)}
textarea{width:100%;resize:vertical}
label{font-size:12px;color:var(--muted);display:block;margin-bottom:2px}
table{border-collapse:collapse;width:100%}
th,td{border-bottom:1px solid var(--line);padding:5px 7px;text-align:left;vertical-align:top}
th{background:#f3f6f8;font-weight:600;font-size:12px;color:#3c4a58}
h2{font-size:16px;margin:0 0 10px}
h3{font-size:13px;margin:0 0 8px;text-transform:uppercase;letter-spacing:.04em;color:#3c4a58}
.top{background:var(--top);color:#fff;display:flex;align-items:center;gap:14px;padding:6px 12px;flex-wrap:wrap}
.brand{font-weight:700;letter-spacing:.02em}
.brand small{font-weight:400;opacity:.75;margin-left:6px}
.simtag{background:#f6c344;color:#3a2a00;font-weight:700;font-size:11px;padding:2px 7px;border-radius:3px}
.top .sp{flex:1}
.clock{display:flex;align-items:center;gap:6px;background:var(--top2);padding:3px 8px;border-radius:4px}
.clock b{font-variant-numeric:tabular-nums;font-size:14px}
.top button{background:transparent;color:#fff;border-color:#4d7383;padding:2px 8px}
.top button:hover{background:#2c5a6c}
.tabs{display:flex;background:var(--top2);padding:0 8px;gap:2px;overflow-x:auto}
.tab{color:#d8e6eb;padding:6px 12px;cursor:pointer;border-radius:4px 4px 0 0;white-space:nowrap;display:flex;gap:8px;align-items:center}
.tab.on{background:var(--bg);color:var(--ink);font-weight:600}
.tab .x{opacity:.6}.tab .x:hover{opacity:1}
.banner{background:#fff;border-bottom:3px solid var(--accent);padding:8px 14px;display:flex;gap:22px;flex-wrap:wrap;align-items:flex-start}
.banner .nm{font-size:18px;font-weight:700}
.banner .sub{color:var(--muted)}
.bfield{min-width:110px}
.bfield .k{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.allergy{background:var(--red-soft);color:var(--red);border:1px solid #f3b8b2;padding:3px 8px;border-radius:4px;font-weight:600}
.pill{display:inline-block;padding:1px 7px;border-radius:10px;font-size:11px;font-weight:600}
.p-red{background:var(--red-soft);color:var(--red)}.p-amb{background:var(--amber-soft);color:var(--amber)}
.p-grn{background:var(--green-soft);color:var(--green)}.p-blu{background:var(--blue-soft);color:var(--blue)}
.p-gry{background:#eceff2;color:#4b5866}
.wrap{display:flex;min-height:calc(100vh - 140px)}
.side{width:178px;background:#fff;border-right:1px solid var(--line);padding:8px 0;flex-shrink:0}
.side div{padding:7px 14px;cursor:pointer;border-left:3px solid transparent}
.side div:hover{background:#f3f7f9}
.side div.on{background:var(--accent-soft);border-left-color:var(--accent);font-weight:600}
.side .cnt{float:right}
.main{flex:1;padding:14px;min-width:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:12px;margin-bottom:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media (max-width:900px){.grid2,.grid3{grid-template-columns:1fr}.side{width:130px}}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:8px}
.hi{color:var(--red);font-weight:700}.lo{color:var(--blue);font-weight:700}
.muted{color:var(--muted)}
.msg{padding:8px 10px;border-radius:4px;margin:8px 0}
.m-red{background:var(--red-soft);color:var(--red);border:1px solid #f3b8b2}
.m-amb{background:var(--amber-soft);color:#6d4300;border:1px solid #f0d28d}
.m-grn{background:var(--green-soft);color:var(--green);border:1px solid #a8dcbf}
.m-blu{background:var(--blue-soft);color:var(--blue);border:1px solid #b5cdea}
.fs td,.fs th{text-align:center;font-variant-numeric:tabular-nums}
.fs td:first-child,.fs th:first-child{text-align:left}
.cell{display:inline-block;min-width:54px;padding:2px 6px;border-radius:3px;font-size:12px}
.c-given{background:var(--green-soft);color:var(--green)}
.c-held{background:#eceff2;color:#4b5866}
.c-due{background:var(--amber-soft);color:var(--amber);font-weight:700}
.c-over{background:var(--red-soft);color:var(--red);font-weight:700}
.c-up{background:#f4f6f8;color:#4b5866}
.medname{font-weight:700}
.overlay{position:fixed;inset:0;background:rgba(15,30,40,.45);display:flex;align-items:flex-start;justify-content:center;padding:40px 12px;z-index:50;overflow:auto}
.modal{background:#fff;border-radius:8px;max-width:680px;width:100%;box-shadow:0 10px 40px rgba(0,0,0,.25)}
.modal .mh{padding:10px 14px;border-bottom:1px solid var(--line);font-weight:700;display:flex;justify-content:space-between}
.modal .mb{padding:14px}
.modal .mf{padding:10px 14px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.drawer button{display:block;width:100%;text-align:left;margin-bottom:4px}
.code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--muted)}
.note{border:1px solid var(--line);border-radius:4px;padding:8px;margin-bottom:8px;white-space:pre-wrap}
.note .nh{font-weight:600;margin-bottom:4px;white-space:normal}
.list tr{cursor:pointer}.list tr:hover td{background:#f6fafb}
.steps{display:flex;gap:6px;margin-bottom:10px}
.steps span{flex:1;text-align:center;padding:4px;border-radius:4px;background:#eef2f5;font-size:12px}
.steps span.ok{background:var(--green-soft);color:var(--green);font-weight:600}
.subtabs{display:flex;gap:4px;margin-bottom:10px}
.subtabs button.on{background:var(--accent-soft);border-color:var(--accent);font-weight:600}
.foot{color:var(--muted);font-size:11px;text-align:center;padding:10px}
</style>
</head>

<div id="app"></div>

function medList(id){const p=P(id),d=S.pt[id];const dc=d.dc||[];return [...p.meds.filter(m=>inSt(m)&&(!m.pendingOrder||d.acked.includes(m.pendingOrder))&&!dc.includes(m.id)),...(d.protoMeds||[]).filter(m=>!dc.includes(m.id))];}
function instances(id,m){const day=Math.floor(S.clock/DAY);
 if(m.type==='once'){const ack=m.dueAt??S.pt[id].ackT?.[m.pendingOrder]??S.clock;return [{key:`${m.id}@once`,due:ack,label:'Once'}];}
 if(m.type!=='sched')return[];
 return m.times.map(t=>({key:`${m.id}@${day}-${t}`,due:day*DAY+hm(t),label:t}));}
function instStatus(id,inst){const a=S.pt[id].admins.find(x=>x.key===inst.key);
 if(a)return{cls:a.status==='given'?'c-given':'c-held',txt:(a.status==='given'?'Given ':'Held ')+fmtHM(a.t),a};
 const diff=S.clock-inst.due;
 if(diff>60)return{cls:'c-over',txt:'OVERDUE'};
 if(diff>=-60)return{cls:'c-due',txt:'Due'};
 return{cls:'c-up',txt:'—'};}
function dueCount(id){let n=0;medList(id).forEach(m=>instances(id,m).forEach(i=>{const s=instStatus(id,i);if(s.cls==='c-over'||s.cls==='c-due')n++;}));return n;}
function lastGiven(id,medId){return S.pt[id].admins.filter(a=>a.med===medId&&a.status==='given').sort((a,b)=>b.t-a.t)[0];}
function reassessTasks(id){const d=S.pt[id],p=P(id);const out=[];
 d.admins.filter(a=>a.status==='given'&&a.pain!=null).forEach(a=>{const m=medById(p.id,a.med);if(!m)return;
  const win=/IV/.test(m.route)?30:60;const due=a.t+win;
  const done=d.vitals.some(v=>v.t>a.t&&v.pain!==undefined&&v.pain!=='');
  out.push({txt:`Pain reassessment after ${m.name} (${fmtHM(a.t)})`,due,done,over:!done&&S.clock>due+15});});
 return out;}
function sliding(bg){bg=+bg;if(bg<70)return{u:0,msg:'Hypoglycemia: HOLD insulin and treat per hypoglycemia protocol.'};
 if(bg<=150)return{u:0};if(bg<=200)return{u:2};if(bg<=250)return{u:4};if(bg<=300)return{u:6};if(bg<=350)return{u:8};if(bg<=400)return{u:10};return{u:10,msg:'BG > 400: give 10 units and notify provider.'};}

const PULSE=['0','1+','2+','3+','4+'];
const AIDS=`<details class="card" style="padding:10px 12px"><summary style="cursor:pointer;font-weight:700">📘 Documentation aids — grading scales &amp; example narratives</summary>
<div class="grid2" style="margin-top:10px">
<div><h3>Pulse grading (program scale)</h3><table><tr><th>Grade</th><th>Palpation</th></tr><tr><td>4+</td><td>Strong, bounding; present on light palpation; not obliterated with pressure</td></tr><tr><td>3+</td><td>Easy to palpate; not easily obliterated with pressure <b>(WDL)</b></td></tr><tr><td>2+</td><td>Difficult to palpate; may be obliterated with pressure</td></tr><tr><td>1+</td><td>Thready, weak; easily obliterated; difficult to palpate</td></tr><tr><td>0</td><td>Not palpable; unable to detect with Doppler</td></tr></table>
<p class="muted" style="font-size:11px">Pulse points (9 bilateral): temporal, carotid, apical, brachial, radial, femoral, popliteal, posterior tibial, dorsalis pedis.</p></div>
<div><h3>Pitting edema</h3><table><tr><th>Grade</th><th>Pit depth</th><th>Rebound</th></tr><tr><td>1+</td><td>2 mm</td><td>Immediate</td></tr><tr><td>2+</td><td>3–4 mm</td><td>&lt; 15 sec</td></tr><tr><td>3+</td><td>5–6 mm</td><td>15–60 sec</td></tr><tr><td>4+</td><td>8 mm</td><td>2–3 min</td></tr></table></div>
<div><h3>Deep tendon reflexes</h3><table><tr><th>Grade</th><th>Response</th></tr><tr><td>4+</td><td>Very brisk, hyperactive, with clonus</td></tr><tr><td>3+</td><td>Brisker than average; slightly hyperreflexic</td></tr><tr><td>2+</td><td>Average, expected response <b>(WDL)</b></td></tr><tr><td>1+</td><td>Somewhat diminished; low normal</td></tr><tr><td>0</td><td>No response; absent</td></tr></table></div>
<div><h3>Muscle strength</h3><table><tr><th>Score</th><th>Finding</th></tr><tr><td>5/5</td><td>Full ROM against examiner’s full resistance (normal)</td></tr><tr><td>4/5</td><td>Full ROM against gravity with some resistance</td></tr><tr><td>3/5</td><td>Full ROM against gravity, not against resistance</td></tr><tr><td>2/5</td><td>Full ROM with gravity eliminated</td></tr><tr><td>1/5</td><td>Trace activation / flicker, no full ROM</td></tr><tr><td>0/5</td><td>No muscle activation</td></tr></table></div>
</div>
<h3 style="margin-top:12px">Example narrative — focused neuro follow-up (all WDL)</h3><div class="note">Patient denies any new onset of headaches, dizziness, visual disturbances, numbness, tingling, or weakness. Alert and oriented to person, place, time, and situation. Dress appropriate for environment; well-groomed with proper hygiene. Cooperative and follows instructions appropriately. Speech clear; facial expressions symmetrical. GCS 15. Gait coordinated and erect with good balance. PERRLA, pupils 4 mm. Sensation intact in all extremities to light touch. Cranial nerves intact ×12. Upper and lower extremity strength and hand grasps 5/5 bilaterally. Cerebellar function intact (alternating hand movements, finger-to-nose). Negative Romberg and pronator drift. Balance stable on heel-to-toe. Tolerated exam without difficulty.</div>
<h3>Example narrative — abnormal findings</h3><div class="note">Patient is alert and oriented ×4. Speech clear; affect and facial expressions appropriate. Cooperative, pleasant, and calm. Dress appropriate, well-groomed. Posture erect in wheelchair with intermittent drift to left side; history of CVA with left-sided hemiplegia. Bilateral hearing aids in place and corrective lenses on. Right pupil 4 mm, round, reactive to light and accommodation. Left pupil 2 mm, round, non-reactive to light and accommodation. Hand grips non-symmetrical with left-sided weakness; right hand grip and RUE strength 4/5. LLE residual weakness 1/5; RLE 4/5. Sensation intact to light touch bilaterally, R &gt; L. Unable to assess Romberg and pronator drift.</div>
<p class="muted" style="font-size:11px">This is not a comprehensive guide. Perform and document the appropriate assessment for each patient.</p></details>`;

function chipsHtml(s){return `<div style="display:flex;flex-wrap:wrap;gap:4px;margin:6px 0">${s.ab.map((a,j)=>`<label style="display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:12px;padding:2px 8px;font-size:12px;color:var(--ink);margin:0;cursor:pointer;background:#fff"><input type="checkbox" id="ab_${s.k}_${j}" style="margin:0">${esc(a)}</label>`).join('')}</div>`;}
function sel(id,opts,def=''){return `<select id="${id}"><option value="">—</option>${opts.map(o=>`<option ${o===def?'selected':''}>${o}</option>`).join('')}</select>`;}
function structHtml(kind){
 if(kind==='pulses')return `<div style="margin:6px 0"><b style="font-size:12px">Pulses (0–4+, 3+ = WDL)</b><table style="width:auto"><tr><th></th><th>L</th><th>R</th></tr>${[['rad','Radial'],['dp','Dorsalis pedis'],['pt','Posterior tibial']].map(([k,l])=>`<tr><td>${l}</td><td>${sel('pl_'+k,PULSE)}</td><td>${sel('pr_'+k,PULSE)}</td></tr>`).join('')}</table></div>
  <div class="row"><div><label>Cap refill</label>${sel('caprf',['< 3 sec','≥ 3 sec'])}</div><div><label>Edema — LUE</label>${sel('ed_lue',['None','1+','2+','3+','4+'])}</div><div><label>RUE</label>${sel('ed_rue',['None','1+','2+','3+','4+'])}</div><div><label>LLE</label>${sel('ed_lle',['None','1+','2+','3+','4+'])}</div><div><label>RLE</label>${sel('ed_rle',['None','1+','2+','3+','4+'])}</div></div>`;
 if(kind==='edema')return '';
 if(kind==='strength')return `<div class="row"><div><label>Strength RUE</label>${sel('st_rue',['0/5','1/5','2/5','3/5','4/5','5/5'])}</div><div><label>LUE</label>${sel('st_lue',['0/5','1/5','2/5','3/5','4/5','5/5'])}</div><div><label>RLE</label>${sel('st_rle',['0/5','1/5','2/5','3/5','4/5','5/5'])}</div><div><label>LLE</label>${sel('st_lle',['0/5','1/5','2/5','3/5','4/5','5/5'])}</div></div>`;
 if(kind==='neuro')return `<div class="row"><div><label>GCS (3–15)</label><input id="gcs" size="3"></div><div><label>Pupil L (mm)</label><input id="pup_l" size="3"></div><div><label>Pupil R (mm)</label><input id="pup_r" size="3"></div><div><label>Pupil reaction</label>${sel('pup_rx',['Brisk bilaterally','Sluggish','Non-reactive L','Non-reactive R','Non-reactive bilaterally'])}</div><div><label>Patellar DTR L</label>${sel('dtr_l',['0','1+','2+','3+','4+'])}</div><div><label>R</label>${sel('dtr_r',['0','1+','2+','3+','4+'])}</div></div>`;
 return '';}
function setStatus(k,v){const box=document.getElementById('ex_'+k);if(box)box.style.display=v==='Exception'?'block':'none';
 const row=document.getElementById('row_'+k);if(row)row.style.background=v==='WDL'?'var(--green-soft)':v==='Exception'?'var(--amber-soft)':'';}
function allWDL(){SYS.forEach(s=>{const el=document.getElementById('st_'+s.k);if(el.value!=='Exception'){el.value='WDL';setStatus(s.k,'WDL');}});}

function vAssess(){const d=D();const hist=[...d.assess].sort((a,b)=>b.t-a.t);
 return `<div class="card"><div class="row" style="justify-content:space-between;align-items:center"><h2 style="margin:0">Head-to-Toe Assessment</h2>${P(UI.active).noAutoWDL?'':'<button onclick="allWDL()">Mark unassessed systems WDL</button>'}</div>
 <p class="muted">Choose <b>WDL</b> only when every element of the definition is true for this patient. Otherwise choose <b>Exception</b>, check the findings, and describe location, size, character, and grade.</p>
 ${AIDS}
 <table>${SYS.map(s=>`<tr id="row_${s.k}"><td style="width:170px"><b>${s.n}</b><div style="margin-top:4px"><select id="st_${s.k}" onchange="setStatus('${s.k}',this.value)"><option>Not assessed</option><option>WDL</option><option>Exception</option></select></div></td>
 <td><div class="muted" style="font-size:12px"><b>WDL:</b> ${esc(s.wdl)}</div>
 <div id="ex_${s.k}" style="display:none;margin-top:6px"><div style="font-size:12px;font-weight:600;color:var(--amber)">Abnormal findings</div>${chipsHtml(s)}${(s.struct||[]).map(structHtml).join('')}<textarea id="tx_${s.k}" rows="2" placeholder="Describe: location, size, color, character, grade, patient report…"></textarea></div></td></tr>`).join('')}</table>
 <div class="row" style="margin-top:10px"><div><label>Time of assessment</label><input id="at" size="5" value="${fmtHM(S.clock)}"></div></div>
 <div id="aerr"></div><button class="pri" onclick="saveA()">File assessment</button></div>
 <div class="card"><h3>Assessment history</h3>${hist.length?hist.map(a=>`<div class="note"><div class="nh">${fmtT(a.t)} · ${esc(a.by)}${lateTag(a.t,a.ct)}${a.bmat?' · '+esc(a.bmat):''}${a.morse!==''?` · Morse ${a.morse} <span class="pill ${+a.morse>=45?'p-red':+a.morse>=25?'p-amb':'p-grn'}">${+a.morse>=45?'High':+a.morse>=25?'Moderate':'Low'} fall risk</span>`:''}${a.braden!==''?` · Braden ${a.braden} <span class="pill ${+a.braden<=12?'p-red':+a.braden<=18?'p-amb':'p-grn'}">${+a.braden<=12?'High':+a.braden<=18?'At':'Low'} risk</span>`:''}</div>${a.narr?esc(a.narr):a.sys.map(s=>`${s.s}: ${s.st}${s.f?' — '+s.f:''}`).join('\n')}</div>`).join(''):'<p class="muted">No assessments filed this shift.</p>'}</div>`;}

function gv(id){const el=document.getElementById(id);return el?el.value.trim():'';}
function structText(kind){const out=[];
 if(kind==='pulses'){const p=[['rad','radial'],['dp','DP'],['pt','PT']].map(([k,l])=>{const L=gv('pl_'+k),R=gv('pr_'+k);return (L||R)?`${l} L ${L||'—'} / R ${R||'—'}`:'';}).filter(Boolean);if(p.length)out.push('Pulses: '+p.join('; ')+'.');
  if(gv('caprf'))out.push('Capillary refill '+gv('caprf')+'.');
  const e=[['lue','LUE'],['rue','RUE'],['lle','LLE'],['rle','RLE']].map(([k,l])=>gv('ed_'+k)?`${l} ${gv('ed_'+k)}`:'').filter(Boolean);if(e.length)out.push('Edema: '+e.join(', ')+'.');}
 if(kind==='strength'){const s=[['rue','RUE'],['lue','LUE'],['rle','RLE'],['lle','LLE']].map(([k,l])=>gv('st_'+k)?`${l} ${gv('st_'+k)}`:'').filter(Boolean);if(s.length)out.push('Strength: '+s.join(', ')+'.');}
 if(kind==='neuro'){if(gv('gcs'))out.push('GCS '+gv('gcs')+'.');if(gv('pup_l')||gv('pup_r'))out.push(`Pupils L ${gv('pup_l')||'—'} mm / R ${gv('pup_r')||'—'} mm${gv('pup_rx')?', '+gv('pup_rx').toLowerCase():''}.`);if(gv('dtr_l')||gv('dtr_r'))out.push(`Patellar DTR L ${gv('dtr_l')||'—'} / R ${gv('dtr_r')||'—'}.`);}
 return out.join(' ');}
function saveA(){const t=parseTime(gv('at'));const err=document.getElementById('aerr');
 if(t===null||t>S.clock){err.innerHTML='<div class="msg m-red">Enter a valid time (HHMM) not in the future.</div>';return;}
 const sys=[],lines=[],bad=[];
 SYS.forEach(s=>{const st=gv('st_'+s.k);if(st==='Not assessed')return;
  if(st==='WDL'){sys.push({s:s.n,st:'WDL',f:''});lines.push(`${s.n}: WDL — ${s.wdl}`);return;}
  const chosen=s.ab.filter((a,j)=>document.getElementById(`ab_${s.k}_${j}`).checked);const tx=gv('tx_'+s.k);const st2=(s.struct||[]).map(structText).filter(Boolean).join(' ');
  if(!chosen.length&&!tx&&!st2){bad.push(s.n);return;}
  const f=[chosen.length?chosen.join('; ')+'.':'',st2,tx].filter(Boolean).join(' ');
  sys.push({s:s.n,st:'Exception',f});lines.push(`${s.n}: EXCEPTION — ${f}`);});
 if(bad.length){err.innerHTML=`<div class="msg m-red">Document at least one finding for: ${bad.join(', ')}</div>`;return;}
 if(!sys.length){err.innerHTML='<div class="msg m-red">Assess at least one system.</div>';return;}
 const scr=null;const morse=scr&&scr.morse!=null?String(scr.morse):'',braden=scr&&scr.braden!=null?String(scr.braden):'';
 if(morse&&(isNaN(+morse)||+morse<0||+morse>125)){err.innerHTML='<div class="msg m-red">Morse score must be 0–125.</div>';return;}
 if(braden&&(isNaN(+braden)||+braden<6||+braden>23)){err.innerHTML='<div class="msg m-red">Braden score must be 6–23.</div>';return;}
 D().assess.push({id:uid(),t,ct:S.clock,by:me(),sys,narr:lines.join('\n'),morse,braden,bmat:scr&&scr.bmat||''});save();render();toast('Assessment filed.');}

function vMar(){const p=P(UI.active),d=D();const scanned=UI.wrist[p.id];
 const meds=medList(p.id);
 const sched=meds.filter(m=>m.type!=='prn'),prn=meds.filter(m=>m.type==='prn');
 const medCell=m=>`<span class="medname">${esc(m.name)}</span> ${esc(m.dose)}${m.proto?` <span class="pill p-blu">${esc(m.proto)}</span>`:''} <button style="padding:0 6px;font-size:11px" onclick="drugCard('${m.id}')">ⓘ</button><div>${esc(m.route)} · ${esc(m.freq)}</div><div class="muted">${esc(m.ind)}</div>${m.note?`<div class="muted" style="font-size:11px">ℹ ${esc(m.note)}</div>`:''}`;
 const sRows=sched.map(m=>`<tr><td>${medCell(m)}</td><td>${instances(p.id,m).map(i=>{const s=instStatus(p.id,i);const can=!s.a;return `<div style="margin-bottom:4px"><b>${i.label}</b> <span class="cell ${s.cls}">${s.txt}</span> ${can?`<button ${scanned?'':'disabled'} onclick="admin('${m.id}','${i.key}',${i.due})">Administer</button>`:''}</div>`;}).join('')}</td></tr>`).join('');
 const pRows=prn.map(m=>{const lg=lastGiven(p.id,m.id);const next=lg?lg.t+m.interval:null;
  return `<tr><td>${medCell(m)}</td><td>${lg?`Last given ${fmtT(lg.t)}${lg.pain!=null?` (pain ${lg.pain})`:''}<div class="${next>S.clock?'muted':''}">Next eligible: ${next>S.clock?fmtT(next):'now'}</div>`:'<span class="muted">Not given this admission</span>'}</td><td><button ${scanned?'':'disabled'} onclick="admin('${m.id}',null,null)">Give PRN</button></td></tr>`;}).join('');
 const hist=[...d.admins].sort((a,b)=>b.t-a.t).map(a=>{const m=medById(p.id,a.med);return `<tr><td>${fmtT(a.t)}${lateTag(a.t,a.ct)}</td><td>${esc(m?m.name:a.med)} ${esc(a.dose||'')}</td><td><span class="pill ${a.status==='given'?'p-grn':'p-gry'}">${a.status}</span></td><td>${esc(a.site||'')}${a.pain!=null?` · pain ${a.pain}`:''}${a.bg!=null?` · BG ${a.bg}`:''}${a.vit?` · ${esc(a.vit)}`:''}${a.reason?` · <i>${esc(a.reason)}</i>`:''}${a.cm?` · ${esc(a.cm)}`:''}</td><td>${esc(a.by)}</td></tr>`;}).join('');
 const tasks=reassessTasks(p.id).filter(t=>!t.done);
 return `<div class="card"><h2>Medication Administration Record</h2>
 ${scanned?`<div class="msg m-grn">✓ Wristband ${scanned==='manual'?'verified by MANUAL OVERRIDE':'scanned'} and two identifiers verified for ${esc(p.name)} (MRN ${p.mrn}). <button onclick="delete UI.wrist['${p.id}'];render()">End med pass</button></div>`:`<div class="msg m-amb">Scan the patient's wristband before administering medications. <button class="pri" onclick="scanBand()">Scan wristband</button> <span class="muted">Tip: with a handheld scanner you can scan the band and med packages directly on this screen.</span></div>`}
 ${tasks.map(t=>`<div class="msg ${t.over?'m-red':'m-amb'}">${esc(t.txt)} due ${fmtHM(t.due)}${t.over?' — OVERDUE':''}</div>`).join('')}
 <h3 style="margin-top:12px">Scheduled & one-time</h3><table><tr><th style="width:45%">Order</th><th>Today's doses</th></tr>${sRows}</table>
 <h3 style="margin-top:16px">PRN</h3><table><tr><th style="width:45%">Order</th><th>Last dose</th><th></th></tr>${pRows}</table></div>
 <div class="card"><h3>Administration history</h3>${hist?`<table><tr><th>Time</th><th>Medication</th><th>Status</th><th>Details</th><th>By</th></tr>${hist}</table>`:'<p class="muted">None.</p>'}</div>`;}

let BAND=null; // result of the wristband scan in the open dialog
function scanBand(pre){const p=P(UI.active);BAND=null;
 modal('Scan patient wristband',`<p>Scan the wristband with a barcode scanner (or type the wristband code and press Enter). No scanner? Use <b>Manual override</b>.</p>
 <input id="bandin" class="scanin" placeholder="▮▯▮ Scan wristband…" autocomplete="off" style="width:100%;font-size:15px;padding:8px" onkeydown="if(event.key==='Enter'){event.preventDefault();bandScanned(this.value)}">

 `<button onclick="closeModal()">Cancel</button><button onclick="bandScanned('MANUAL')">Manual override</button><button class="pri" onclick="confirmBand()">Confirm</button>`);
 setTimeout(()=>{const el=document.getElementById('bandin');if(el){el.focus();if(pre){el.value=pre;bandScanned(pre);}}},30);}
function bandScanned(code){code=String(code).trim().toUpperCase();const p=P(UI.active);const res=document.getElementById('bandres');
 if(code==='MANUAL'){BAND='manual';res.innerHTML=`<div class="msg m-amb">Manual override — no scan recorded. Verify the band visually: <b>${esc(p.name)}</b> · DOB ${p.dob} · MRN ${p.mrn}</div>`;document.getElementById('bandver').style.display='block';return;}
 const other=bandCode(p)===code?p:(VIS().find(x=>bandCode(x)===code)||PATIENTS.find(x=>bandCode(x)===code));
 if(other&&other.id===p.id){BAND='scan';res.innerHTML=`<div class="msg m-grn">✓ Wristband scanned: <b>${esc(p.name)}</b> · DOB ${p.dob} · MRN ${p.mrn}${p.allergies.length?` · <span style="color:var(--red)">ALLERGY: ${esc(p.allergies.map(a=>a.agent).join(', '))}</span>`:''}</div>`;document.getElementById('bandver').style.display='block';}
 else if(other){BAND=null;res.innerHTML=`<div class="msg m-red"><b>⚠ WRONG PATIENT.</b> This wristband belongs to ${esc(other.name)} (MRN ${other.mrn}), not the open chart (${esc(p.name)}, MRN ${p.mrn}). Stop and verify.</div>`;document.getElementById('bandver').style.display='none';}

function ndcOf(code){const d=String(code).replace(/\D/g,'');if(d.length===12&&d[0]==='3')return d.slice(1,11);if(d.length===13&&d.startsWith('03'))return d.slice(2,12);if(d.length>=16&&d.startsWith('01'))return d.slice(5,15);if(d.length===14&&d.startsWith('003'))return d.slice(3,13);return null;}
function findInDrawer(p,code){code=String(code).trim().toUpperCase();const n=ndcOf(code);return drawerOf(p.id).findIndex(x=>x.code.toUpperCase()===code||x.code.replace(/-/g,'').toUpperCase()===code.replace(/-/g,'')||(n&&x.code.replace(/\D/g,'')===n));}

 if(i>=0){M.scanned=code;scanMed(i);return;}

 if(pt)M.scanMsg=`<div class="msg m-amb">That is a patient wristband (${esc(pt.name)}). Scan the medication package.</div>`;
 else if(PATIENTS.some(x=>findInDrawer(x,code)>=0))M.scanMsg=`<div class="msg m-red"><b>⚠ Not this patient's medication.</b> Barcode ${esc(code)} is stocked for another patient. Return it and check the order.</div>`;
 else M.scanMsg=`<div class="msg m-red">Barcode not recognized: ${esc(code)}</div>`;

function scanMed(i){const p=P(UI.active),x=drawerOf(p.id)[i],med=medById(p.id,M.medId);
 const alg=allergyList(p.id).find(a=>(x.allergyAgent&&x.allergyAgent.test(a.agent))||String(a.agent).toLowerCase().split(/[^a-z]+/).filter(w=>w.length>=5).some(w=>x.label.toLowerCase().includes(w)));
 if(x.allergy)M.scanMsg=`<div class="msg m-red"><b>⚠ ${esc(x.allergy)}</b><br>Return this medication. Do not administer.</div>`;
 else if(alg)M.scanMsg=`<div class="msg m-red"><b>⚠ ALLERGY ALERT: ${esc(x.label)}</b> — patient allergy: ${esc(alg.agent)} (${esc(alg.reaction)}). ${x.allergyMsg?esc(x.allergyMsg)+' ':''}Do not administer; notify the provider.</div>`;
 else if(matches(x,med)){M.scan='ok';M.scanMsg='';}

  if(other)M.scanMsg=`<div class="msg m-red">Wrong medication for this administration: this barcode matches a different order (${esc(other.name+' '+other.dose)}).</div>`;

function grab(){const ids=['xhr','xsbp','xdbp','xrr','xspo2','xposs','xrefl','xtime','xpain','xploc','xind','xbg','xunits','xdose','xroute','xsite','xcm','xover'];const f={};ids.forEach(k=>{const el=document.getElementById(k);if(el)f[k]=el.value.trim();});return f;}
function checks(f){const p=P(UI.active),d=D(),m=medById(p.id,M.medId);const hard=[],warn=[];const AT=f.xtime!==undefined?parseTime(f.xtime):S.clock;if(AT===null)hard.push('Enter the time given as HHMM.');else if(AT>S.clock)hard.push('Time given cannot be in the future.');else if(S.clock-AT>240)hard.push('Time given is more than 4 h ago — document a late-entry note and notify your instructor.');const NOW=AT??S.clock;
 preCheck(p.id,m,f,hard,warn);labCheck(p.id,m,warn);
 if(m.type==='prn'&&m.pain){if(f.xpain===''||isNaN(+f.xpain)||+f.xpain<0||+f.xpain>10)hard.push('Enter a pain score (0–10).');
  else{const s=+f.xpain;if(s<m.pain[0]||s>m.pain[1]){const better=medList(p.id).filter(o=>o.type==='prn'&&o.pain&&s>=o.pain[0]&&s<=o.pain[1]&&o.id!==m.id).map(o=>o.name+' '+o.dose);warn.push(`Pain ${s}/10 is outside this order's range (${m.pain[0]}–${m.pain[1]}).${better.length?' Consider: '+better.join('; ')+'.':''}`);}}}
 if(m.type==='prn'&&!m.pain&&!f.xind)hard.push('Document the indication.');
 if(m.ssi){if(f.xbg===''||isNaN(+f.xbg))hard.push('Enter the blood glucose.');else{const sc=sliding(f.xbg);
   if(f.xunits===''||isNaN(+f.xunits))hard.push('Enter units given (enter 0 if none).');
   else if(+f.xunits!==sc.u)warn.push(`Dose error: BG ${f.xbg} → scale dose is ${sc.u} units, you entered ${f.xunits}.`);
   if(sc.msg)warn.push(sc.msg);}}
 if(m.type==='prn'){const lg=lastGiven(p.id,m.id);if(lg&&NOW-lg.t<m.interval)warn.push(`Too soon: last given ${fmtT(lg.t)}. Next eligible ${fmtT(lg.t+m.interval)} (${m.freq}).`);}
 if(m.maxDaily){const tot=d.admins.filter(a=>a.status==='given'&&S.clock-a.t<DAY&&/Acetaminophen/.test((medById(p.id,a.med)||{}).name||'')).length*m.mg+m.mg;if(tot>m.maxDaily)warn.push(`Acetaminophen 24-h total would be ${tot} mg (max ${m.maxDaily} mg).`);}
 if(M.key&&M.due!=null){const diff=NOW-M.due;if(diff<-30)warn.push(`Early: scheduled ${fmtHM(M.due)}, given ${fmtHM(NOW)} (> 30 min early).`);if(diff>30)warn.push(`Late: scheduled ${fmtHM(M.due)}, given ${fmtHM(NOW)} (> 30 min late). Document reason.`);}
 if(m.abx&&m.sepsis&&!d.labOrd.some(o=>o.test==='Blood cultures ×2'&&o.coll!=null))warn.push('Blood cultures have not been collected. Draw cultures BEFORE antibiotics unless doing so would delay antibiotics by more than 45 min.');

 if(/IV|subcut/.test(m.route)&&!f.xsite)hard.push('Document the administration site.');
 if(/tube/i.test(m.route)){const ng=(D().devices||[]).find(o=>o.kind==='ng'&&o.status==='in place');if(!ng)warn.push('No feeding tube is documented as in place (Lines & Devices).');else if(!/Confirmed/.test(ng.xray))warn.push('Feeding tube placement has not been confirmed by X-ray — do not give medications through it.');else if(ng.alert)warn.push('Feeding tube alert: '+ng.alert);}

function ins(what){const p=P(UI.active),d=D();let s='';const day=Math.floor(S.clock/DAY);
 if(what==='vs'){const v=k=>latestV(p.id,k);const bp=v('sbp');s=`VS: T ${v('temp')?.val??'—'} °C, HR ${v('hr')?.val??'—'}, RR ${v('rr')?.val??'—'}, BP ${bp?bp.val+'/'+bp.row.dbp:'—'}, SpO2 ${v('spo2')?.val??'—'}% on ${v('o2')?.val??'—'}, pain ${v('pain')?.val??'—'}/10.`;}
 if(what==='meds'){s='Meds today: '+(d.admins.filter(a=>Math.floor(a.t/DAY)===day).sort((a,b)=>a.t-b.t).map(a=>`${fmtHM(a.t)} ${(medById(p.id,a.med)||{}).name} ${a.dose||''} (${a.status})`).join('; ')||'none')+'.';}
 if(what==='io'){const t=d.io.filter(x=>Math.floor(x.t/DAY)===day);const i=t.filter(x=>x.kind==='in').reduce((a,x)=>a+x.amt,0),o=t.filter(x=>x.kind==='out').reduce((a,x)=>a+x.amt,0);s=`I&O today: intake ${i} mL, output ${o} mL, net ${i-o>0?'+':''}${i-o} mL.`;}
 if(what==='assess'){const a=[...d.assess].sort((x,y)=>y.t-x.t)[0];s=a?`Assessment (${fmtT(a.t)}):\n`+(a.narr||''):'No assessment filed yet.';}
 if(what==='labs'){s='Abnormal labs ('+p.labTime+'): '+p.labs.filter(l=>l[4]).map(l=>`${l[0]} ${l[1]} (${l[4]})`).join(', ')+'.';}
 const t=document.getElementById('ntx');const pos=t.selectionStart??t.value.length;t.value=t.value.slice(0,pos)+s+t.value.slice(pos);t.focus();}
function signNote(){const x=document.getElementById('ntx').value.trim();if(x.length<10){document.getElementById('nerr').innerHTML='<div class="msg m-red">Note is empty or too short.</div>';return;}
 if(Object.values(TPL).filter(Boolean).some(t=>x===t.trim())){document.getElementById('nerr').innerHTML='<div class="msg m-red">Complete the template before signing.</div>';return;}
 const tt=parseTime(document.getElementById('nTm').value);if(tt===null||tt>S.clock){document.getElementById('nerr').innerHTML='<div class="msg m-red">Enter the time of the event (HHMM), not in the future.</div>';return;}
 D().notes.push({id:uid(),t:tt,ct:S.clock,type:document.getElementById('nt').value,by:me(),signed:true,txt:x});save();render();toast('Note signed.');}

 VIS().forEach(p=>{const d=S.pt[p.id];const seedIds=new Set([...p.vitals,...p.io,...p.notes,...p.admins,...p.care].map(x=>x.id));

  mine(d.vitals).forEach(v=>out+=`VS ${fmtT(v.t)}: ${['temp','hr','rr','sbp','dbp','spo2','o2','pain','loc'].filter(k=>v[k]!==undefined).map(k=>k+' '+v[k]).join(', ')} — ${v.by}\n`);
  d.assess.forEach(a=>out+=`Assessment ${fmtT(a.t)} — ${a.by}:\n${a.narr||a.sys.map(s=>s.s+' '+s.st+(s.f?' ('+s.f+')':'')).join('; ')}${a.morse?'; Morse '+a.morse:''}${a.braden?'; Braden '+a.braden:''}\n`);
  mine(d.admins).forEach(a=>out+=`MAR ${fmtT(a.t)} (${a.by}): ${(medById(p.id,a.med)||{}).name} ${a.dose||''} — ${a.status}${a.site?' — '+a.site:''}${a.pain!=null?' — pain '+a.pain:''}${a.bg!=null?' — BG '+a.bg:''}${a.vit?' — '+a.vit:''}${a.reason?' — '+a.reason:''}\n`);
  mine(d.io).forEach(x=>out+=`I&O ${fmtT(x.t)} (${x.by}): ${x.kind} ${x.cat} ${x.amt} mL\n`);

  (d.scores||[]).forEach(r=>out+=`SAFETY ${fmtT(r.t)}: Morse ${r.morse??'—'}; Braden ${r.braden??'—'}; BMAT ${r.bmat||'—'}${(r.ints||[]).length?'; precautions: '+r.ints.join(', '):''}\n`);
  (d.ords||[]).forEach(o=>out+=`ORDER ${fmtT(o.t)} [${o.set}] ${o.text} — ${o.mode}${o.cm?' — '+o.cm:''}\n`);
  (d.labOrd||[]).filter(o=>o.coll!=null).forEach(o=>out+=`SPECIMEN ${fmtT(o.coll)} — ${o.collBy||''}: ${o.test}${o.sites?' ('+o.sites.join(' + ')+')':''}${o.tube?' — '+o.tube+', '+o.site:''}\n`);
  (d.sc||[]).forEach(e=>out+=`${e.kind==='scan'?'BLADDER SCAN':'STRAIGHT CATH'} ${fmtT(e.t)} — ${e.by}: ${e.txt}\n`);
  (d.devices||[]).filter(o=>o.kind==='ng').forEach(o=>(o.log||[]).forEach(l=>out+=`FEEDING TUBE ${l.ty} ${fmtT(l.t)} — ${l.by}: ${l.txt}\n`));
  (d.devices||[]).forEach(o=>out+=`DEVICE ${o.type}: ${o.status}; indication: ${o.ind}${o.insT!=null?'; inserted '+fmtT(o.insT):''}${o.remT!=null?'; removed '+fmtT(o.remT):''}\n`);

 modal('Export',`<textarea id="exp" rows="16" readonly>${esc(out)}</textarea><div id="cpm"></div>`,`<button onclick="closeModal()">Close</button>${OFFLINE?'<button onclick="exportFile()">Download .txt</button><button onclick="exportPrint()">Print</button>':''}<button class="pri" onclick="navigator.clipboard.writeText(document.getElementById('exp').value).then(()=>document.getElementById('cpm').innerHTML='<div class=&quot;msg m-grn&quot;>Copied.</div>').catch(()=>{const t=document.getElementById('exp');t.select();document.getElementById('cpm').innerHTML='<div class=&quot;msg m-amb&quot;>Text selected — press Ctrl/Cmd+C to copy.</div>';})">Copy to clipboard</button>`);}

/* Simulation protocol values are modeled on the program's example order set. Verify thresholds/doses against clinical-partner policy. */
const HOSP='Sound View Teaching Hospital';
const kgOf=p=>parseFloat(p.wt);
function vancDose(p){const mg=Math.round(kgOf(p)*20/250)*250;return mg>=1000?(mg/1000)+' g':mg+' mg';}
const STOCK=[
 {code:'0245-0058-11',label:'Potassium chloride ER 20 mEq tablet'},
 {code:'99001-120-01',label:'Potassium chloride oral solution 20 mEq/15 mL'},
 {code:'99001-110-01',label:'Potassium chloride 10 mEq/100 mL IVPB (peripheral)'},
 {code:'99001-111-01',label:'Potassium chloride 20 mEq/100 mL IVPB — CENTRAL LINE ONLY'},
 {code:'99001-210-01',label:'Magnesium sulfate 2 g/50 mL IVPB'},
 {code:'99001-320-01',label:'K-Phos Neutral 250 mg tablet (8 mmol phosphorus)'},
 {code:'99001-310-01',label:'Sodium phosphates 15 mmol/250 mL IVPB'},
 {code:'99001-410-01',label:'Lactated Ringer’s 1,000 mL'},
 {code:'99001-510-01',label:'Piperacillin-tazobactam 4.5 g/100 mL IVPB',allergyAgent:/penicillin/i,allergyMsg:'ALLERGY ALERT: Piperacillin is a penicillin.'},
 {code:'99001-520-01',label:'Aztreonam 2 g/100 mL IVPB'},
 {code:'77002-310-01',label:'Doxycycline hyclate 100 mg tablet'},
 {code:'77002-320-01',label:'Azithromycin 500 mg tablet'}
];
const vancPkg=p=>({code:'VANC-'+p.mrn,label:`Vancomycin ${vancDose(p)} IVPB — pharmacy prepared for ${p.name}`});
function drawerOf(id){const p=P(id);const list=[...p.drawer,...((S.pt[id]&&S.pt[id].xdrawer)||[])];const seen=new Set(list.map(x=>x.code));
 [...STOCK,vancPkg(p)].forEach(x=>{if(!seen.has(x.code)){list.push({...x,stock:true});seen.add(x.code);}});return list;}
const matches=(x,m)=>!!((x.m&&x.m.includes(m.id))||(m.codes&&m.codes.includes(x.code)));
function medById(id,medId){return P(id).meds.find(x=>x.id===medId)||(S.pt[id].protoMeds||[]).find(x=>x.id===medId);}
function allPending(id){return [...P(id).pending.filter(inSt),...(S.pt[id].pendDyn||[])];}
function openPending(id){const d=S.pt[id];return allPending(id).filter(o=>!d.acked.includes(o.id));}

/* ---------- Labs ---------- */
const TAT={'Lactate':20,'Blood cultures ×2':60,'CBC':45,'CMP':60,'Potassium':60,'Magnesium':60,'Phosphorus':60,'Urinalysis with reflex culture':60};
const DEFREF={Potassium:['mmol/L','3.5–5.0'],Magnesium:['mg/dL','1.7–2.2'],Phosphorus:['mg/dL','2.5–4.5'],Lactate:['mmol/L','0.5–2.0'],WBC:['K/µL','4.5–11.0'],Hemoglobin:['g/dL','12.0–17.5'],Platelets:['K/µL','150–400'],Sodium:['mmol/L','135–145'],Creatinine:['mg/dL','0.6–1.2'],Glucose:['mg/dL','70–99'],BUN:['mg/dL','7–20']};
function labsAll(id){const p=P(id);return [...p.labs.map(l=>({name:l[0],val:l[1],unit:l[2],ref:l[3],flag:l[4],t:300,base:true})),...(S.pt[id].labsAdd||[])];}
function latestLab(id,name,before=Infinity){return labsAll(id).filter(l=>l.name===name&&l.t<=before).sort((a,b)=>b.t-a.t)[0];}
function refFor(id,name){const b=P(id).labs.find(l=>l[0]===name);return b?{unit:b[2],ref:b[3]}:{unit:(DEFREF[name]||['',''])[0],ref:(DEFREF[name]||['',''])[1]};}
function flagCalc(ref,v){if(typeof v!=='number')return'';const m=String(ref).match(/([\d.]+)\s*[–-]\s*([\d.]+)/);if(m){if(v<+m[1])return'L';if(v>+m[2])return'H';return'';}const lt=String(ref).match(/<\s*([\d.]+)/);if(lt&&v>=+lt[1])return'H';return'';}
const r1=v=>Math.round(v*10)/10;
function vAt(id,f,t){const v=S.pt[id].vitals.filter(x=>x.t<=t&&x[f]!==undefined&&x[f]!=='').sort((a,b)=>b.t-a.t)[0];return v?+v[f]:null;}
function givenBetween(id,a,b,pred){return S.pt[id].admins.filter(x=>x.status==='given'&&x.t>a&&x.t<=b).map(x=>({x,m:medById(id,x.med)})).filter(o=>o.m&&pred(o.m));}
const DEC1=['Lactate','Potassium','Magnesium','Phosphorus','WBC','Creatinine','Hemoglobin'];
function mk(id,name,val){const r=refFor(id,name);return{name,val,vs:DEC1.includes(name)?Number(val).toFixed(1):String(val),unit:r.unit,ref:r.ref,flag:flagCalc(r.ref,val)};}
function genResults(id,o){const t=o.coll,d=S.pt[id];const out=[];
 const K=()=>{const pr=latestLab(id,'Potassium',t);let v=pr.val;givenBetween(id,pr.t,t,m=>m.k).forEach(g=>v+=g.m.k*0.01);v-=0.2*givenBetween(id,pr.t,t,m=>m.loop).length;return r1(Math.max(2.0,v));};
 if(o.test==='Lactate'){const sbp=vAt(id,'sbp',t)??120,hr=vAt(id,'hr',t)??80,tp=vAt(id,'temp',t)??37;
  const L=givenBetween(id,t-360,t,m=>m.fluid).reduce((s,g)=>s+(g.m.vol||0),0)/1000;
  let v=1.2+(sbp<90?1.6:sbp<100?0.8:0)+(hr>120?0.8:hr>110?0.4:0)+(tp>=39?0.4:0)-0.6*L;out.push(mk(id,'Lactate',r1(Math.max(0.8,v))));}
 if(o.test==='Potassium')out.push(mk(id,'Potassium',K()));
 if(o.test==='Magnesium'){const pr=latestLab(id,'Magnesium',t);let v=pr.val;givenBetween(id,pr.t,t,m=>m.mgG).forEach(g=>v+=g.m.mgG*0.15);out.push(mk(id,'Magnesium',r1(v)));}
 if(o.test==='Phosphorus'){const pr=latestLab(id,'Phosphorus',t);let v=pr.val;givenBetween(id,pr.t,t,m=>m.phos).forEach(g=>v+=g.m.phos*0.02);out.push(mk(id,'Phosphorus',r1(v)));}
 if(o.test==='CBC'){const sep=d.sep&&d.sep.state==='positive';out.push(mk(id,'WBC',r1(latestLab(id,'WBC',t).val+(sep?1.8:0.2))),mk(id,'Hemoglobin',latestLab(id,'Hemoglobin',t).val),mk(id,'Platelets',latestLab(id,'Platelets',t).val));}
 if(o.test==='CMP'){const sbp=vAt(id,'sbp',t)??120;out.push(mk(id,'Sodium',latestLab(id,'Sodium',t).val),mk(id,'Potassium',K()),mk(id,'Creatinine',r1(latestLab(id,'Creatinine',t).val+(sbp<90?0.3:0))),mk(id,'Glucose',latestLab(id,'Glucose',t).val));}
 if(o.test==='Blood cultures ×2')out.push({name:'Blood cultures ×2',val:'No growth to date (preliminary; final at 5 days)',unit:'',ref:'No growth',flag:''});
 if(o.test==='Urinalysis with reflex culture')out.push({name:'Urinalysis',val:'Clear yellow; leukocyte esterase neg; nitrite neg; WBC 0–2/hpf',unit:'',ref:'Negative',flag:''});
 return out;}
function labDue(id,o){if(o.after){const a=S.pt[id].admins.filter(x=>x.med===o.after.med&&x.status==='given').sort((x,y)=>x.t-y.t)[0];if(!a)return null;const m=medById(id,o.after.med);return a.t+(m&&m.dur||0)+o.after.offset;}return o.dueT;}
function addLab(id,test,why,dueT,set,extra={}){S.pt[id].labOrd.push({id:uid(),test,why,dueT,ordT:S.clock,set,by:me(),coll:null,resT:null,...extra});}
let NEWS=[];
function processAll(){PATIENTS.forEach(p=>{const d=S.pt[p.id];
 (d.labOrd||[]).forEach(o=>{if(o.coll!=null&&o.resT==null){const tat=TAT[o.test]||60;if(S.clock>=o.coll+tat){const res=genResults(p.id,o);o.resT=o.coll+tat;res.forEach(r=>d.labsAdd.push({...r,t:o.resT,ord:o.id}));
   const crit=res.filter(r=>(r.name==='Lactate'&&r.val>=4)||(r.name==='Potassium'&&(r.val<3||r.val>6))||(r.name==='Magnesium'&&r.val<1.2));

const MAP=(s,d)=>Math.round((+s+2*+d)/3);
function sepsisCriteria(id){const v=k=>latestV(id,k);const T=v('temp'),HR=v('hr'),RR=v('rr'),SBP=v('sbp'),SP=v('spo2'),W=latestLab(id,'WBC'),L=latestLab(id,'Lactate');

 if(RR&&RR.val>20)sirs.push(`RR ${RR.val} (${fmtHM(RR.t)})`);
 if(W&&(W.val>12||W.val<4))sirs.push(`WBC ${W.val} K/µL (${fmtHM(W.t)})`);
 let map=null;if(SBP){map=MAP(SBP.val,SBP.row.dbp);if(SBP.val<90)organ.push(`SBP ${SBP.val} < 90`);if(map<65)organ.push(`MAP ${map} < 65`);}
 if(L&&L.val>=2)organ.push(`Lactate ${L.val} ≥ 2`);if(SP&&SP.val<90)organ.push(`SpO₂ ${SP.val}% < 90`);
 const a=[...S.pt[id].assess].sort((x,y)=>y.t-x.t)[0];const alt=a&&a.sys.some(s=>s.s==='Neurological'&&/Confused|Disoriented|Somnolent/.test(s.f));if(alt)organ.push('Altered mental status (last neuro assessment)');

 return{sirs,organ,q,map};}

function sepsisProviderOrders(id){const p=P(id),d=S.pt[id];const pcn=p.allergies.some(a=>/penicillin/i.test(a.agent));const by=p.attending;

 const lr=d.protoMeds.find(m=>m.fluid);const lrA=lr&&d.admins.find(a=>a.med===lr.id&&a.status==='given');const lrP=allPending(id).find(o=>o.id==='o_sepLR');

const bradenTier=s=>s<=9?['Very high risk','p-red','All high-risk measures plus a pressure-redistribution / specialty surface; consider wound-care consult.']:s<=12?['High risk','p-red','Turn at least q2h with additional small position shifts; 30° lateral tilt with wedges; float heels; pressure-redistributing mattress; manage moisture.']:s<=14?['Moderate risk','p-amb','Turning schedule q2h; 30° lateral tilt with foam wedges; float heels; maximize activity; manage moisture, nutrition, and friction.']:s<=18?['Mild risk (at risk)','p-amb','Turning schedule; maximize mobility; protect heels; manage moisture, nutrition, and friction; pressure-redistributing surface if bed- or chair-bound.']:['Not at risk','p-grn','Routine skin assessment and prevention; reassess with any change in condition.'];
const BMAT=[
 {k:1,l:'Sit and Shake',why:'Trunk strength and seated balance',how:'From a semi-reclined position, have the patient sit up at the edge of the bed (may use the bedrail) and keep balance, then reach across the body midline to shake your hand with each hand.',fail:['Mobility Level 1','Dependent: use a full-body lift with sling and/or repositioning aids; bed-level mobility and turning schedule; follow early/progressive mobility protocol to advance.']},

 {k:3,l:'Stand',why:'Leg strength for standing',how:'Have the patient rise from bed or chair and hold the buttocks off the surface for about 5 seconds; an assistive device (cane, walker, crutches) may be used.',fail:['Mobility Level 3','Use a non-powered stand aid, or a powered sit-to-stand lift if none is available; gait belt and assistive device for transfers.']},

const BMAT_PASS=['Mobility Level 4 — modified independent','Passed all four assessments: standby assistance/supervision as needed; use any assistive device the patient uses at home.'];
function scSt(){UI.sc=UI.sc||{};const id=UI.active;if(!UI.sc[id]){const p=P(id),d=D();const lastS=[...(d.scores||[])].sort((a,b)=>b.t-a.t)[0];
  const st={m:{},b:{},bm:[]};
  st.m.iv=d.devices.some(o=>o.kind==='piv'&&o.status==='in place')?1:0;st.m.dx=p.problems.length>1?1:0;st.auto=true;
  if(lastS){Object.assign(st.m,lastS.mI||{});Object.assign(st.b,lastS.bI||{});}UI.sc[id]=st;}return UI.sc[id];}
function morseTotal(st){return MORSE.every(i=>st.m[i.k]!=null)?MORSE.reduce((s,i)=>s+i.o[st.m[i.k]][1],0):null;}
function bradenTotal(st){return BRADEN.every(i=>st.b[i.k]!=null)?BRADEN.reduce((s,i)=>s+st.b[i.k],0):null;}
function bmatLevel(st){const r=st.bm;for(let i=0;i<BMAT.length;i++){if(r[i]==='fail')return BMAT[i].fail;if(r[i]!=='pass')return null;}return BMAT_PASS;}
function scSet(kind,k,v){const st=scSt();if(kind==='bm'){st.bm=st.bm.slice(0,k);st.bm[k]=v;}else st[kind][k]=v;render();}
function scoresHtml(){const st=scSt(),tab=UI.sub.sc||'morse';
 const mt=morseTotal(st),bt=bradenTotal(st),bl=bmatLevel(st);
 const pill=(t,f)=>t==null?'<span class="pill p-gry">incomplete</span>':`<span class="pill ${f(t)[1]}">${t} · ${f(t)[0]}</span>`;
 const tabs=[['morse',`Morse Fall Scale ${mt!=null?'· '+mt:''}`],['braden',`Braden Scale ${bt!=null?'· '+bt:''}`],['bmat',`BMAT ${bl?'· '+bl[0].replace(/ —.*/,''):''}`]].map(([k,l])=>`<button class="${tab===k?'on':''}" onclick="UI.sub.sc='${k}';render()">${l}</button>`).join('');
 let b='';
 if(tab==='morse'){b=`<table>${MORSE.map(i=>`<tr><td style="width:38%"><b>${esc(i.l)}</b></td><td>${i.o.map((o,j)=>`<button class="${st.m[i.k]===j?'pri':''}" style="margin:2px" onclick="scSet('m','${i.k}',${j})">${esc(o[0])} <b>(${o[1]})</b></button>`).join('')}${st.auto&&(i.k==='iv'||i.k==='dx')?'<div class="muted" style="font-size:11px">Pre-filled from the chart — verify</div>':''}</td></tr>`).join('')}</table>
  <div class="row" style="margin-top:8px;align-items:center"><b>Total:</b> ${pill(mt,morseTier)}</div>${mt!=null?`<div class="msg m-blu">${esc(morseTier(mt)[2])}</div>`:''}<p class="muted" style="font-size:11px">Morse Fall Scale (Morse, 1989). Total 0–125; commonly used cutoffs 0–24 low, 25–44 moderate, ≥ 45 high — confirm your facility's cutoffs.</p>`;}
 if(tab==='braden'){b=`<div style="overflow-x:auto"><table>${BRADEN.map(i=>`<tr><td style="width:150px"><b>${esc(i.l)}</b><div class="muted" style="font-size:11px">${esc(i.sub)}</div></td>${i.o.map(o=>`<td style="padding:3px"><div onclick="scSet('b','${i.k}',${o[0]})" style="cursor:pointer;border:2px solid ${st.b[i.k]===o[0]?'var(--accent)':'var(--line)'};background:${st.b[i.k]===o[0]?'var(--accent-soft)':'#fff'};border-radius:6px;padding:6px;min-height:84px;font-size:12px"><b>${o[0]} — ${esc(o[1])}</b><div class="muted" style="font-size:11px;margin-top:2px">${esc(o[2])}</div></div></td>`).join('')}${i.o.length<4?'<td></td>':''}</tr>`).join('')}</table></div>
  <div class="row" style="margin-top:8px;align-items:center"><b>Total:</b> ${pill(bt,bradenTier)}</div>${bt!=null?`<div class="msg m-blu">${esc(bradenTier(bt)[2])}${st.b.nut<=2?' Nutrition subscale ≤ 2 — consider dietitian consult.':''}${st.b.moi<=2?' Moisture subscale ≤ 2 — barrier cream, prompt incontinence care, moisture-wicking pads.':''}</div>`:''}<p class="muted" style="font-size:11px">Braden Scale for Predicting Pressure Sore Risk (Bergstrom &amp; Braden). Descriptors abbreviated for this simulation; the official tool is copyrighted — use your facility's licensed version. Total 6–23; ≤ 18 = at risk.</p>`;}
 if(tab==='bmat'){b=`<p class="muted">Test in order. Stop at the first level the patient cannot do. Use "safe mode" (bed in chair position, sit-to-stand lift with vest) if you are unsure the patient can do a level safely.</p>${BMAT.map((t,i)=>{const prevOk=i===0||st.bm[i-1]==='pass';const r=st.bm[i];
  return `<div style="border:1px solid var(--line);border-radius:6px;padding:8px 10px;margin:6px 0;opacity:${prevOk?1:.45}"><b>Assessment Level ${t.k}: ${esc(t.l)}</b> <span class="muted">— ${esc(t.why)}</span><div style="font-size:12px;margin:4px 0">${esc(t.how)}</div>
  ${prevOk?`<button class="${r==='pass'?'pri':''}" onclick="scSet('bm',${i},'pass')">Pass</button> <button class="${r==='fail'?'danger':''}" onclick="scSet('bm',${i},'fail')">Fail / unable</button>`:''}</div>`;}).join('')}
  ${bl?`<div class="msg ${/Level 4 — modified/.test(bl[0])?'m-grn':'m-amb'}"><b>${esc(bl[0])}</b><br>${esc(bl[1])}</div>`:''}<button onclick="UI.sc[UI.active].bm=['fail'];render()" style="margin-top:4px">Unable to test (bed rest order, non-weight-bearing, unstable) → Level 1</button>
  <p class="muted" style="font-size:11px">Based on the Bedside Mobility Assessment Tool (BMAT 2.0, Banner Health / Boynton et al., 2020). Wording paraphrased for simulation — follow your facility's version and equipment.</p>`;}
 return `<div class="card" style="border-color:#b5cdea"><div class="row" style="justify-content:space-between;align-items:center"><h3 style="margin:0">Safety scores</h3><div class="row" style="margin:0;align-items:center"><label style="margin:0">Time</label><input id="scT" size="5" value="${fmtHM(S.clock)}"><button class="pri" onclick="saveScores()">File safety scores</button></div></div><div class="subtabs" style="margin-top:8px">${tabs}</div>${b}<div id="scE"></div></div>`;}
function saveScores(silent){const st=scSt(),d=D();const mt=morseTotal(st),bt=bradenTotal(st),bl=bmatLevel(st);
 if(mt==null&&bt==null&&!bl){if(!silent)document.getElementById('scE').innerHTML='<div class="msg m-red">Complete at least one tool (all items) before filing.</div>';return null;}
 const ti=document.getElementById('scT');const tt=ti?parseTime(ti.value):S.clock;if(tt===null||tt>S.clock){if(!silent)document.getElementById('scE').innerHTML='<div class="msg m-red">Enter a valid time (HHMM), not in the future.</div>';return null;}
 const ints=[...document.querySelectorAll('input[data-int]:checked')].map(x=>x.dataset.int);
 const rec={id:uid(),t:tt,ct:S.clock,by:me(),ints,morse:mt,mI:{...st.m},braden:bt,bI:{...st.b},bmat:bl?bl[0]:null};d.scores=d.scores||[];d.scores.push(rec);st.auto=false;save();
 if(!silent){render();toast(`Scores filed:${mt!=null?' Morse '+mt+' ('+morseTier(mt)[0]+')':''}${bt!=null?' · Braden '+bt+' ('+bradenTier(bt)[0]+')':''}${bl?' · '+bl[0]:''}`);}return rec;}

const FALL_INT=['Bed low and locked','Call light and personal items within reach','Non-skid footwear','Bed/chair exit alarm on','Fall-risk ID band / signage','Hourly rounding','Scheduled toileting','Gait belt / assistive device for ambulation','PT consult requested'];
const SKIN_INT=['Turned/repositioned q2h','Heels floated','30° lateral tilt with wedges','Pressure-redistributing mattress','Barrier cream / incontinence care','Moisture-wicking pad','Nutrition consult requested','Head of bed ≤ 30° unless contraindicated'];
function vSafety(){const d=D();const hist=[...(d.scores||[])].sort((a,b)=>b.t-a.t);
 const chk=(arr,pre)=>`<div style="display:flex;flex-wrap:wrap;gap:4px">${arr.map(x=>`<label style="display:inline-flex;gap:4px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:2px 8px;font-size:12px;color:var(--ink);margin:0"><input type="checkbox" data-int="${esc(pre+x)}" style="margin:0">${esc(x)}</label>`).join('')}</div>`;
 return `<h2>Safety</h2>${scoresHtml()}
 <div class="card"><h3>Precautions in place (filed with the scores)</h3><label>Fall prevention</label>${chk(FALL_INT,'Fall: ')}<label style="margin-top:8px">Skin / pressure-injury prevention</label>${chk(SKIN_INT,'Skin: ')}</div>
 <div class="card"><h3>Safety score history</h3>${hist.length?`<table><tr><th>Time</th><th>Morse</th><th>Braden</th><th>BMAT</th><th>Precautions</th><th>By</th></tr>${hist.map(r=>`<tr><td>${fmtT(r.t)}${lateTag(r.t,r.ct)}</td><td>${r.morse!=null?`<span class="pill ${morseTier(r.morse)[1]}">${r.morse}</span>`:'—'}</td><td>${r.braden!=null?`<span class="pill ${bradenTier(r.braden)[1]}">${r.braden}</span>`:'—'}</td><td>${esc(r.bmat||'—')}</td><td style="font-size:12px">${esc((r.ints||[]).join('; ')||'—')}</td><td>${esc(r.by)}</td></tr>`).join('')}</table>`:'<p class="muted">No safety scores filed yet. Complete on admission, every shift, with any change in condition, and after a fall.</p>'}</div>`;}
function latestScores(id){const s=[...(S.pt[id].scores||[])].sort((a,b)=>b.t-a.t);return{m:s.find(x=>x.morse!=null),b:s.find(x=>x.braden!=null),bm:s.find(x=>x.bmat)};}
function scoresSummary(id){const L=latestScores(id);if(!L.m&&!L.b&&!L.bm)return'';
 return `<div class="card"><h3>Safety scores</h3><table>${L.m?`<tr><td>Morse</td><td><span class="pill ${morseTier(L.m.morse)[1]}">${L.m.morse} · ${morseTier(L.m.morse)[0]}</span></td><td class="muted">${fmtHM(L.m.t)}</td></tr>`:''}${L.b?`<tr><td>Braden</td><td><span class="pill ${bradenTier(L.b.braden)[1]}">${L.b.braden} · ${bradenTier(L.b.braden)[0]}</span></td><td class="muted">${fmtHM(L.b.t)}</td></tr>`:''}${L.bm?`<tr><td>BMAT</td><td>${esc(L.bm.bmat)}</td><td class="muted">${fmtHM(L.bm.t)}</td></tr>`:''}</table></div>`;}

function preCheck(pid,m,f,hard,warn){const F=preFields(m),info=drugInfo(m)||{};
 const need=[];if(F.has('HR')&&(f.xhr===''||isNaN(+f.xhr)))need.push('apical HR');if(F.has('SBP')&&(f.xsbp===''||f.xdbp===''||isNaN(+f.xsbp)))need.push('BP');if(F.has('RR')&&(f.xrr===''||isNaN(+f.xrr)))need.push('respiratory rate');if(F.has('SpO2')&&(f.xspo2===''||isNaN(+f.xspo2)))need.push('SpO₂');if(F.has('POSS')&&!f.xposs)need.push('sedation (POSS)');if(F.has('Reflex')&&!f.xrefl)need.push('patellar reflex');
 if(need.length){hard.push('Before giving, document: '+need.join(', ')+'.');return;}
 const val={HR:+f.xhr,SBP:+f.xsbp,RR:+f.xrr,SpO2:+f.xspo2,POSS:f.xposs?(f.xposs[0]==='S'?0:+f.xposs[0]):null,Reflex:f.xrefl};const seen=new Set();
 [...(m.holds||[]),...(info.holds||[])].forEach(h=>{const v=val[h.f];const hit=(h.lt!=null&&v<h.lt)||(h.gt!=null&&v>h.gt)||(h.eq!=null&&v===h.eq);const key=h.f+(h.lt??'')+(h.gt??'')+(h.eq??'');if(hit&&!seen.has(key)){seen.add(key);warn.push(h.msg||`Hold parameter met: ${h.f} ${v} < ${h.lt}. Hold the dose and notify the provider.`);}});}

let SBUF='',SLAST=0;

 if(document.getElementById('modal').innerHTML)return;
 const now=Date.now();if(now-SLAST>600)SBUF='';SLAST=now;
 if(e.key==='Enter'){const c=SBUF.trim();SBUF='';if(c.length>=4){e.preventDefault();globalScan(c);}return;}

 open.sort((a,b)=>Math.abs(a.due-S.clock)-Math.abs(b.due-S.clock));return open[0];}

 if(pt){if(!UI.active){openPt(pt.id);}UI.act='mar';render();scanBand(up);return;}
 if(!UI.active){toast('Open a patient chart (or scan a wristband) before scanning medications.');return;}
 const p=P(UI.active);
 if(!UI.wrist[p.id]){UI.act='mar';render();toast('Scan the patient\'s wristband before scanning medications.');return;}
 const i=findInDrawer(p,code);
 if(i<0){UI.act='mar';render();if(PATIENTS.some(x=>findInDrawer(x,code)>=0))modal('Scan alert',`<div class="msg m-red"><b>⚠ Not this patient's medication.</b> Barcode ${esc(code)} is stocked for another patient.</div>`,'<button onclick="closeModal()">OK</button>');else toast('Barcode not recognized: '+code);return;}
 const x=drawerOf(p.id)[i];
 if(x.allergy||!medList(p.id).some(m=>matches(x,m))){UI.act='mar';render();modal('Scan alert',`<div class="msg m-red"><b>${esc(x.label)}</b><br>${esc(x.allergy||x.wrong||'No active order for this product for this patient.')}</div><p>Return this medication. Do not administer.</p>`,'<button onclick="closeModal()">OK</button>');return;}
 const cands=medList(p.id).filter(m=>matches(x,m)).map(m=>({m,inst:pickInstance(p.id,m)})).filter(c=>c.inst);
 if(!cands.length){UI.act='mar';render();toast(`${x.label}: no remaining doses due today for this order.`);return;}
 cands.sort((a,b)=>(a.inst.due==null?1e9:Math.abs(a.inst.due-S.clock))-(b.inst.due==null?1e9:Math.abs(b.inst.due-S.clock)));
 const c=cands[0];UI.act='mar';render();admin(c.m.id,c.inst.key,c.inst.due);scanMed(i);}

const SC_DEF={thr:400,cath:'14 Fr straight',notify:'2nd straight catheterization within 24 h, bladder volume > 1,000 mL, resistance on insertion, hematuria, or no void within 6 h after catheterization'};
function scParams(id){return Object.assign({},SC_DEF,P(id).sc||{});}
function scCard(){const d=D(),id=UI.active,pr=scParams(id);d.sc=d.sc||[];const list=[...d.sc].sort((a,b)=>b.t-a.t);
 return `<div class="card"><div class="row" style="justify-content:space-between;align-items:center"><h2 style="margin:0">Bladder Scan &amp; Straight Catheterization</h2><div class="row" style="margin:0"><button onclick="scScan()">+ Bladder scan</button><button onclick="scCath()">+ Straight cath</button></div></div>
 <div class="msg m-blu"><b>Protocol parameters:</b> Bladder scan if no void in 6 h or urge without voiding. Volume ≥ ${pr.thr} mL → straight catheterize (${esc(pr.cath)}) with sterile technique. Notify provider for: ${esc(pr.notify)}.</div>
 ${list.length?`<table><tr><th>Time</th><th>Entry</th><th>Details</th><th>By</th></tr>${list.map(e=>`<tr><td>${fmtT(e.t)}</td><td>${e.kind==='scan'?'Bladder scan':'Straight cath'}</td><td>${esc(e.txt)}</td><td>${esc(e.by)}</td></tr>`).join('')}</table>`:'<p class="muted">No bladder scans or straight catheterizations documented.</p>'}</div>`;}
function scScan(){modal('Bladder scan',`<div class="row"><div><label>Time</label><input id="ssT" size="5" value="${fmtHM(S.clock)}"></div><div><label>Bladder volume (mL)</label><input id="ssV" size="5"></div><div><label>Last void (time or "none since …")</label><input id="ssL" size="16"></div></div><label>Symptoms / findings</label><input id="ssC" style="width:100%" placeholder="e.g., suprapubic fullness, urge, restlessness"><div id="ssE"></div>`,
 `<button onclick="closeModal()">Cancel</button><button class="pri" onclick="scScanSave()">Save</button>`);}
function scScanSave(){const g=x=>document.getElementById(x).value.trim();const v=+g('ssV');if(!g('ssV')||isNaN(v)){document.getElementById('ssE').innerHTML='<div class="msg m-red">Enter the bladder volume.</div>';return;}
 const pr=scParams(UI.active),t=tAt('ssT');const act=v>1000?`≥ ${pr.thr} mL and > 1,000 mL — straight catheterize per protocol AND notify provider`:v>=pr.thr?`≥ ${pr.thr} mL — straight catheterization indicated per protocol`:`Below ${pr.thr} mL — encourage voiding; rescan per protocol`;
 const d=D();d.sc=d.sc||[];d.sc.push({id:uid(),t,kind:'scan',vol:v,txt:`${v} mL; last void ${g('ssL')||'—'}${g('ssC')?'; '+g('ssC'):''} → ${act}`,by:me()});save();closeModal();render();
 modal('Bladder scan result',`<div class="msg ${v>=pr.thr?'m-amb':'m-grn'}">${v} mL — ${esc(act)}</div>`,'<button class="pri" onclick="closeModal()">OK</button>');}
function scCath(){const d=D();const last=[...(d.sc||[])].filter(e=>e.kind==='scan').sort((a,b)=>b.t-a.t)[0];
 modal('Straight (intermittent) catheterization',`<div class="row"><div><label>Time</label><input id="scT" size="5" value="${fmtHM(S.clock)}"></div><div><label>Catheter</label>${selO('scK',['12 Fr straight','14 Fr straight','16 Fr straight','14 Fr coudé straight'],'14 Fr straight')}</div><div><label>Pre-cath bladder scan</label><input value="${last?last.vol+' mL at '+fmtHM(last.t):'none documented'}" readonly size="18"></div></div>
 <div class="row"><div><label>Insertion</label>${selO('scI',['Passed without resistance','Met resistance — stopped, not completed','Met resistance — passed with gentle steady pressure'],'Passed without resistance')}</div><div><label>Attempts</label>${selO('scA',['1','2'],'1')}</div><div><label>Urine return (mL)</label><input id="scU" size="5"></div><div><label>Color / clarity</label><input id="scC" size="16" value="Clear yellow"></div></div>
 ${chk('scK0','Perineal care; sterile field and sterile technique maintained')}${chk('scK1','Catheter removed after drainage; patient tolerated; perineum dried')}<label>Comments</label><input id="scM" style="width:100%"><div id="scE"></div>`,
 `<button onclick="closeModal()">Cancel</button><button class="pri" onclick="scCathSave()">Save</button>`);}
function scCathSave(){const g=x=>document.getElementById(x).value.trim();const E=document.getElementById('scE');const d=D(),pr=scParams(UI.active),t=tAt('scT');
 const stopped=/stopped/.test(g('scI'));if(!stopped&&(g('scU')===''||isNaN(+g('scU')))){E.innerHTML='<div class="msg m-red">Enter the urine return in mL.</div>';return;}
 if(![0,1].every(i=>document.getElementById('scK'+i).checked)){E.innerHTML='<div class="msg m-red">Complete the checklist.</div>';return;}
 const last=[...(d.sc||[])].filter(e=>e.kind==='scan'&&e.t<=t).sort((a,b)=>b.t-a.t)[0];const prior=(d.sc||[]).filter(e=>e.kind==='cath'&&e.done&&t-e.t<DAY).length;
 const al=[];if(!last||t-last.t>120)al.push('No bladder scan in the 2 h before catheterization — the protocol requires a scan first.');else if(last.vol<pr.thr)al.push(`Last scan ${last.vol} mL is below the protocol threshold (${pr.thr} mL).`);
 if(stopped)al.push('Resistance — do not force. Notify the provider (consider coudé catheter order).');if(!stopped&&prior>=1)al.push('This is the 2nd straight catheterization within 24 h — notify the provider.');if(+g('scU')>1000)al.push('Return > 1,000 mL — notify the provider.');if(/blood|red|pink/i.test(g('scC')))al.push('Hematuria — notify the provider.');
 d.sc=d.sc||[];d.sc.push({id:uid(),t,kind:'cath',done:!stopped,txt:`${g('scK')}; ${g('scI').toLowerCase()}; ${g('scA')} attempt(s)${stopped?'':`; return ${g('scU')} mL ${g('scC').toLowerCase()}`}; sterile technique${g('scM')?'; '+g('scM'):''}`,by:me()});
 if(!stopped&&+g('scU'))d.io.push({id:uid(),t,ct:S.clock,kind:'out',cat:'Urine',amt:+g('scU'),by:me()+' (straight cath)'});save();closeModal();render();
 if(al.length)modal('Straight cath — follow-up',al.map(x=>`<div class="msg m-red">${esc(x)}</div>`).join(''),'<button class="pri" onclick="closeModal()">Acknowledge</button>');else toast('Straight catheterization documented.');}

/* ================= SBAR TO PROVIDER + INSTRUCTOR AS PROVIDER ================= */
const RX_LIB=[
 {k:'doxy',label:'Doxycycline 100 mg PO BID',med:{name:'Doxycycline hyclate',dose:'100 mg',route:'PO',freq:'BID',type:'sched',times:['0900','2100'],abx:true,ind:'Community-acquired pneumonia (penicillin allergy)',note:'Tetracycline class — no penicillin cross-reactivity. Give with a full glass of water, upright 30 min; separate from antacids, calcium, iron, and dairy by 2 h.',codes:['77002-310-01']}},
 {k:'azith',label:'Azithromycin 500 mg PO daily',med:{name:'Azithromycin',dose:'500 mg',route:'PO',freq:'Daily',type:'sched',times:['0900'],abx:true,ind:'Community-acquired pneumonia',note:'Macrolide — no penicillin cross-reactivity. QT prolongation risk: check ECG/QTc and potassium/magnesium.',codes:['77002-320-01']}},
 {k:'furo',label:'Furosemide 20 mg IV push once now',med:{name:'Furosemide',dose:'20 mg (2 mL of 10 mg/mL)',route:'IV push',freq:'Once — now',type:'once',loop:true,ind:'Fluid overload',note:'Give over 1–2 min (no faster than 20 mg/min). Flush before and after (SAS). Check BP and potassium first; monitor urine output.',codes:['0054-8297-25']}},
 {k:'kpo',label:'Potassium chloride ER 20 mEq PO now and at 1700',med:{name:'Potassium chloride ER',dose:'20 mEq (1 × 20 mEq tablet)',route:'PO',freq:'Now, then 1700',type:'once',ind:'Hypokalemia (K 3.2)',note:'Swallow whole with food and a full glass of water — do not crush or chew. Recheck BMP per provider.',codes:['0245-0058-11']}},
 {k:'apap',label:'Acetaminophen 650 mg PO q6h PRN fever',med:{name:'Acetaminophen',dose:'650 mg',route:'PO',freq:'q6h PRN',type:'prn',interval:360,mg:650,maxDaily:3000,ind:'Temp > 38.3 °C or mild pain',note:'Max 3,000 mg/24 h.',codes:['0904-6730-61']}}];
const LAB_LIB=['Blood cultures ×2','CBC','CMP','Lactate','Potassium','Magnesium','Urinalysis with reflex culture'];
function sbarModal(){const p=P(UI.active);const al=allergyList(p.id).map(a=>a.agent+' ('+a.reaction+')').join(', ')||'NKDA';
 modal('Notify provider — SBAR',`<div class="row"><div><label>Provider</label><input id="sbTo" value="${esc(p.attending)}" size="28"></div><div><label>Method</label><select id="sbM"><option>Phone</option><option>Secure chat</option><option>In person</option></select></div></div>
 <label>S — Situation</label><textarea id="sbS" rows="2" placeholder="Who you are, the patient, and the problem in one or two sentences"></textarea>
 <label>B — Background</label><textarea id="sbB" rows="2">${esc(`${p.ageTxt||p.age+' y'} ${p.sex}, admitted for ${p.dx}. Allergies: ${al}.`)}</textarea>
 <label>A — Assessment</label><textarea id="sbA" rows="3" placeholder="Current vital signs, findings, and what you think is happening"></textarea>
 <label>R — Recommendation / request</label><textarea id="sbR" rows="2" placeholder="What you need: orders, an evaluation, a time frame"></textarea><div id="sbE"></div>`,
 `<button onclick="closeModal()">Cancel</button><button class="pri" onclick="sbarSend()">Send to provider</button>`);}
function sbarSend(){const g=x=>document.getElementById(x).value.trim();if(!g('sbS')||!g('sbA')||!g('sbR')){document.getElementById('sbE').innerHTML='<div class="msg m-red">Complete Situation, Assessment, and Recommendation.</div>';return;}
 const d=D();d.sbar=d.sbar||[];const r={id:uid(),t:S.clock,to:g('sbTo'),m:g('sbM'),s:g('sbS'),b:g('sbB'),a:g('sbA'),r:g('sbR'),by:me(),status:'sent'};d.sbar.push(r);
 d.notes.push({id:uid(),t:S.clock,ct:S.clock,type:'Provider Notification',by:me(),signed:true,txt:`Provider notified: ${r.to} via ${r.m} at ${fmtHM(S.clock)}.\nS: ${r.s}\nB: ${r.b}\nA: ${r.a}\nR: ${r.r}`});
 save();closeModal();render();toast('SBAR sent — waiting for the provider’s response. New orders will appear under Orders.');}
function sbarCard(){const d=D();const list=[...(d.sbar||[])].sort((a,b)=>b.t-a.t);
 return `<div class="card" style="border-color:#b5cdea"><div class="row" style="justify-content:space-between;align-items:center"><h3 style="margin:0">Provider communication</h3><button class="pri" onclick="sbarModal()">📞 Notify provider (SBAR)</button></div>
 ${list.length?list.map(r=>`<div class="note" style="white-space:normal"><div class="nh">${fmtT(r.t)} · to ${esc(r.to)} (${esc(r.m)}) · ${esc(r.by)} <span class="pill ${r.status==='answered'?'p-grn':'p-amb'}">${r.status==='answered'?'Answered':'Awaiting response'}</span></div><div><b>R:</b> ${esc(r.r)}</div>${r.resp?`<div class="msg m-blu" style="margin-top:6px"><b>Provider (${fmtHM(r.resp.t)}):</b> ${esc(r.resp.txt)}${r.resp.n?` — ${r.resp.n} new order(s) to acknowledge.`:''}</div>`:''}</div>`).join(''):'<p class="muted" style="margin:6px 0 0">No SBAR sent yet.</p>'}</div>`;}
function inboxHtml(){const items=[];VIS().forEach(p=>(S.pt[p.id].sbar||[]).filter(r=>r.status==='sent').forEach(r=>items.push({p,r})));
 return items.length?items.map(({p,r})=>`<div class="note" style="white-space:normal"><div class="nh">${esc(p.name)} · ${fmtT(r.t)} · from ${esc(r.by)}</div><div><b>S:</b> ${esc(r.s)}</div><div><b>A:</b> ${esc(r.a)}</div><div><b>R:</b> ${esc(r.r)}</div><button class="pri" style="margin-top:6px" onclick="respondModal('${p.id}','${r.id}')">Respond as provider</button></div>`).join(''):'<p class="muted">No SBARs waiting.</p>';}
function respondModal(pid,rid){const p=P(pid);
 modal('Respond as provider — '+esc(p.name),`<label>Verbal response to the RN</label><textarea id="rpT" rows="2">Thank you. I’m entering orders now — please read them back.</textarea>
 <h3 style="margin-top:10px">Medication orders</h3>${RX_LIB.map(x=>`<div><label style="color:var(--ink);font-size:13px;margin:2px 0"><input type="checkbox" id="rx_${x.k}"> ${esc(x.label)}</label></div>`).join('')}
 <details style="margin:6px 0"><summary class="muted" style="cursor:pointer">Custom medication order</summary><div class="row"><div><label>Medication</label><input id="cmN" size="16"></div><div><label>Dose</label><input id="cmD" size="8"></div><div><label>Route</label><input id="cmR" size="5" value="PO"></div><div><label>Frequency</label><input id="cmF" size="8" value="Once"></div><div><label>Indication</label><input id="cmI" size="14"></div></div></details>
 <h3 style="margin-top:10px">Lab orders (collect now)</h3><div style="display:flex;flex-wrap:wrap;gap:6px">${LAB_LIB.map((t,i)=>`<label style="color:var(--ink);font-size:13px;margin:0"><input type="checkbox" id="lb_${i}"> ${esc(t)}</label>`).join('')}</div>
 <label style="margin-top:8px">Other order (free text)</label><input id="rpO" style="width:100%" placeholder="e.g., Hold ceftriaxone pending allergy clarification">`,
 `<button onclick="closeModal()">Cancel</button><button class="pri" onclick="respondSend('${pid}','${rid}')">Send orders</button>`);}
function respondSend(pid,rid){const p=P(pid),d=S.pt[pid],r=d.sbar.find(x=>x.id===rid),g=x=>document.getElementById(x).value.trim();let n=0;const by=p.attending;
 RX_LIB.forEach(x=>{if(document.getElementById('rx_'+x.k).checked){const id='rx'+uid();d.pendDyn.push({id:'o_'+id,type:'med',text:`${x.label} — ${x.med.ind}`,by,med:{...x.med,id}});n++;}});
 if(g('cmN')&&g('cmD')){const id='rx'+uid(),code='RX-'+id.slice(2,8).toUpperCase();const once=/once/i.test(g('cmF'));
  d.xdrawer=d.xdrawer||[];d.xdrawer.push({code,label:`${g('cmN')} ${g('cmD')} (pharmacy)`,m:[id]});
  d.pendDyn.push({id:'o_'+id,type:'med',text:`${g('cmN')} ${g('cmD')} ${g('cmR')} ${g('cmF')}${g('cmI')?' — '+g('cmI'):''}`,by,med:{id,name:g('cmN'),dose:g('cmD'),route:g('cmR'),freq:g('cmF'),type:once?'once':'sched',times:['0900'],ind:g('cmI')||'Per provider'}});n++;}
 const labs=LAB_LIB.filter((t,i)=>document.getElementById('lb_'+i).checked);if(labs.length){d.pendDyn.push({id:'o_lab'+uid(),type:'other',text:`Labs now: ${labs.join(', ')}`,by,labs});n++;}
 if(g('rpO')){d.pendDyn.push({id:'o_txt'+uid(),type:'other',text:g('rpO'),by});n++;}
 r.status='answered';r.resp={t:S.clock,txt:g('rpT'),n};d.notes.push({id:uid(),t:S.clock,ct:S.clock,type:'Provider Notification',by:by+' (provider)',signed:true,txt:`Provider response to SBAR from ${r.by}: ${g('rpT')}${n?` ${n} new order(s) entered.`:''}`});
 save();closeModal();render();toast(`Response sent to ${p.name}'s chart${n?` with ${n} new order(s)`:''}.`);}

/* ---------- Start ---------- */
render();
if(!S.user){modal('Welcome to CareChart Academic',`<p>This is a practice electronic health record with fictional patients. Everything you chart is saved in this browser only.</p><label>Your name & credentials (used to sign your documentation)</label><input id="wn" style="width:100%" placeholder="e.g., J. Rivera, SN">`,
 `<button class="pri" onclick="S.user=document.getElementById('wn').value.trim()||'Student';save();closeModal();render()">Start shift</button>`);}
</script>
